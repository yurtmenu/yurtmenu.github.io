<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self' https://yurtmenu.goatcounter.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Yurt Panel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yurt Panel">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-192.png">
<style>
/* Menü uygulamasının gri tasarımıyla aynı renkler; tema telefonun ayarını izler */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --fg:#1C1E22; --muted:#6B6F76; --hair:rgba(28,30,34,.11);
  --accent:#2A2D33; --accent-soft:#E6E7EA; --on-accent:#FFFFFF;
  --link:#000080; --link-soft:#E6E6F4; --warn:#C2352B; --chip:#ECEDEF;
  --bar:#2A2D33; --bar-2:#9EA2A9;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111214; --surface:#1C1E22; --fg:#EDEEF0; --muted:#9A9DA3; --hair:rgba(237,238,240,.12);
  --accent:#D4D6DA; --accent-soft:#2A2D33; --on-accent:#111214;
  --link:#9A9CFF; --link-soft:#23244A; --warn:#FF7D72; --chip:#26282D;
  --bar:#D4D6DA; --bar-2:#5C6068; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:max(14px, env(safe-area-inset-top, 0px)) var(--gut-r) calc(28px + env(safe-area-inset-bottom, 0px)) var(--gut-l)}
header{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
h1{font:700 24px/1.15 var(--f-display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
header .sp{flex:1}
.btn{border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:active{opacity:.7}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut-r)) 14px calc(-1 * var(--gut-l));padding:2px var(--gut-r) 2px var(--gut-l)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px var(--hair)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.tile.genis{grid-column:1 / -1}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px}
.tile .n{font:700 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;break-inside:avoid}
.card h2{font:700 15px/1.2 var(--f-ui);margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.card h2 .t{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.grid{columns:1;column-gap:10px}
@media (min-width:720px){.grid{columns:2}}
@media (min-width:1000px){.grid{columns:3}}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .gl{stroke:var(--hair)}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-top:1px solid var(--hair)}
.rows li:first-child{border-top:0}
.rows .ad{overflow-wrap:anywhere}
.rows .say{font-variant-numeric:tabular-nums;font-weight:600}
.rows .cubuk{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.rows .cubuk b{display:block;height:100%;background:var(--bar-2);border-radius:2px}
.more{border:0;background:none;color:var(--link);font-weight:600;padding:8px 0 0;font-size:14px}
.empty{color:var(--muted);font-size:14px}
.err{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--warn);font-weight:600}
.key{max-width:420px;margin:22vh auto 0;background:var(--surface);border-radius:20px;padding:22px 18px 18px}
.key h1{margin-bottom:16px}
.keyrow{display:flex;gap:8px}
.key input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px;background:var(--chip);font-size:16px}
.key input:focus{outline:2px solid var(--accent);outline-offset:-2px}
.key .btn{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:0 18px}
.keyerr{color:var(--warn);font-size:14px;margin:10px 0 0}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;color:var(--muted);font-size:13px}
footer .btn{background:none;color:var(--warn);padding:6px 0}
.loading{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module" src="panel.js"></script>
</body>
</html>
